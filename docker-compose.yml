# One command starts everything:  docker compose up --build
# Optional: to use Claude for protocol digitization, put ANTHROPIC_API_KEY=... in a
# .env file next to this one. Without it, a free rule-based parser is used.
#   App:      http://localhost:8080
#   API docs: http://localhost:8000/docs

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: studyforge
      POSTGRES_PASSWORD: studyforge
      POSTGRES_DB: studyforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Job queue for the worker, and pub/sub for live events between processes.
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://studyforge:studyforge@db:5432/studyforge
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:4200"]'
      # Local demo only. Anywhere real, use a long random secret from a secrets manager.
      JWT_SECRET: local-docker-secret-change-me-0123456789abcdef
      UPLOAD_DIR: /data/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Background worker: same image as the API, different command.
  worker:
    build: ./api
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
