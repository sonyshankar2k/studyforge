# Database migrations run once per release as a Job, before the new API pods
# start (not inside every API container, where replicas would race each other).
apiVersion: batch/v1
kind: Job
metadata:
  name: studyforge-migrate
  labels:
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studyforge-migrate
    spec:
      serviceAccountName: studyforge-api
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: studyforge-api
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: studyforge-config
            - secretRef:
                name: studyforge-secrets
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
