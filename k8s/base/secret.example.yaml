# NOT applied by kustomize. Real secrets come from a secrets manager (e.g. AWS
# Secrets Manager via External Secrets Operator) or are created by hand:
#   kubectl -n studyforge create secret generic studyforge-secrets \
#     --from-literal=DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/studyforge \
#     --from-literal=REDIS_URL=redis://host:6379/0 \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=ANTHROPIC_API_KEY=
apiVersion: v1
kind: Secret
metadata:
  name: studyforge-secrets
  namespace: studyforge
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://studyforge:change-me@postgres:5432/studyforge
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: change-me-to-a-long-random-value
  ANTHROPIC_API_KEY: ""
