# In the dev cluster, only the app's own pods may reach the database, Redis and MinIO.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backing-services
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [postgres, redis, minio] }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [api, worker, studyforge-migrate]
