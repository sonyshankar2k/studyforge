# SonarQube Cloud (sonarcloud.io): code quality, security hotspots, duplication and
# test coverage for both the API and the web app. CI fails if the quality gate fails.
sonar.organization=sonyshankar2k
sonar.projectKey=sonyshankar2k_studyforge
sonar.projectName=StudyForge
sonar.host.url=https://sonarcloud.io
sonar.qualitygate.wait=true

sonar.sources=api/app,web/src
sonar.tests=api/tests,web/src,web/e2e
sonar.test.inclusions=web/src/**/*.spec.ts,web/e2e/**/*.ts,api/tests/**/*.py
sonar.exclusions=web/src/**/*.spec.ts,**/node_modules/**,**/dist/**
sonar.sourceEncoding=UTF-8

sonar.python.version=3.12
sonar.python.coverage.reportPaths=api/coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/web/lcov.info
