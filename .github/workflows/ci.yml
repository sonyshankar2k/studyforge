name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test (unit, integration and OpenAPI contract tests)
        env:
          CONTRACT_EXAMPLES: "40"
        run: uv run pytest -q

  # Applies the migrations to a real PostgreSQL and fails if the models
  # have changes that no migration covers.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: studyforge
          POSTGRES_PASSWORD: studyforge
          POSTGRES_DB: studyforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://studyforge:studyforge@localhost:5432/studyforge
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Upgrade to head
        run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check
      - name: Downgrade and upgrade again
        run: uv run alembic downgrade base && uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build

  # The whole stack in Docker, driven by a real browser (Playwright).
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: web
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
